<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>

    <style>




        .login-page{
            width: 51vw;
            height: 100vh;
            color: rgb(255, 255, 255);
            margin-left: 900px;
            background-color: rgb(255, 254, 254);
        }

        .login-box{
               background: #fff;
               padding: 30px;
               width: 350px;
               border-radius: 5px;
               color: black;
               

               
        }

        .login-box h2{
            margin-bottom: 20px;
            color: #e17438;
            text-align: center;
            
        
        }

        label {
        display: block;
        margin-top: 20px;
        }


        input {
        width: 100%;
        padding: 2px;
        margin-top: 5px;
        }

        button {
        width: 100%;
        padding: 10px;
        background: #b35a2a;
        color: white;
        border: none;
       }

       .remember{
        margin-top: 4px;
         
       }

       .checkbox{
        margin-top: 5px;
        
       }
       

    </style>
</head>
<body>

    <div class="login-page">
        <form class="login-box">
            <h2>Login form</h2>
            <label for="email">Email</label>
            <input type="email">
            <label for="password">Password</label>
            <input type="password">

            <div class="remember">
                <label class="checkbox" for="remember me">Remember me</label>
                <input type="checkbox">
               
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
    
</body>
</html>
