<!DOCTYPE html>
<html>
<head>
  <title>DOM Form Example</title>

  <style>
    #output {
      color: blue;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <form id="myForm">
    <input type="text" id="textInput" placeholder="Enter text">
    <input type="submit" value="Submit">
  </form>

  <p id="output"
     onmouseover="changeColor(this, 'over')"
     onmouseout="changeColor(this, 'out')">
  </p>

  <script>

      var inputText = document.getElementById("textInput").value;
      var para = document.getElementById("output");

      if (inputText === "") {
        para.innerHTML = "Please enter some text";
      } else {
        para.innerHTML = inputText;
        para.style.color = "blue";
      }
    ;

    function changeColor(obj, action) {
      if (action === "over") {
        obj.style.color = "green";
      } else {
        obj.style.color = "blue";
      }
    }
  </script>

</body>
</html>
