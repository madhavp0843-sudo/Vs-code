<!DOCTYPE html>
<html>
<head>
<title>Lottery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
    body{
        margin: 30px;
        background-color: rgb(242, 242, 163);
        margin: 100px;

    }
</style>
</head>
<body>

  <h3>Lottery Draw</h3>
<button type="button" class="btn btn-primary" onclick="selectWinner()" data-bs-toggle="modal" data-bs-target="#exampleModal">
  Winner
</button>
<h4 id="abc"></h4>
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <h3 id="popup"></h3>
        
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
<script>

var lottery = [45, 56, 98, 48, 76, 105];

function selectWinner() {
var random = Math.floor(Math.random() * lottery.length);
var winner = lottery[random];
console.log("Winner: " + winner);
document.getElementById("abc").innerHTML=winner;
document.getElementById("abc").style.color="red";
document.getElementById("popup").innerHTML=winner;
}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
